<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Official Yapmod Collection</title>
  <style>
    :root { color-scheme: light dark; font: 100%/1.55 system-ui, sans-serif; }
    main { max-width: 48rem; margin: 3rem auto; padding: 0 1rem; }
    article { border-top: 1px solid GrayText; padding: 1.25rem 0 2rem; }
    h2 { margin: 0; }
    label { display: block; margin-top: 1rem; font-weight: 600; }
    input { display: block; width: 100%; box-sizing: border-box; padding: .6rem; font: .9rem monospace; }

<body>
  <main>
    <h1>Official Yapmod Collection</h1>
    <p>Plugins maintained by Yapmod.</p>
    <p>Download individual plugins or add the whole collection in <strong>Plugins → Add Plugin → Collection</strong>.</p>
    <label>Yapmod collection URL<input readonly value="https://raw.githubusercontent.com/yapmod/official-collection/plugin-dist/index.json" onclick="this.select()"></label>
    <p><a href="./index.json" download="index.json">Download collection index</a></p>

  </main>
